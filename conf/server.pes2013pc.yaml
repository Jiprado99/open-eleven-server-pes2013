Server:
  AdvertiseIp: "pes.example.com"   # your domain; an IP or "auto" only with Https.Enabled: false
  GameProfile: Pes2013Pc

  Listen:
    Host: 0.0.0.0
    Https: 8446
    Http: 80
    Backlog: 128
    IdleTimeoutSeconds: 300

  Https:
    Enabled: true                 # false = plain HTTP on port 80
    CertificatePath: "certs/fullchain.pem"
    KeyPath: "certs/privkey.pem"

  Captcha:
    Provider: None                # None | Turnstile | HCaptcha | ReCaptcha | Custom
    SiteKey: ""
    SecretKey: ""
  Admin:
    User: admin
    Password: ""                  # empty = admin portal off

  Database:
    Provider: Sqlite              # Sqlite | MySql
    ConnectionString: "Data Source=data/pes2013pc.db"
    AutoCreate: true

  Services:
    - Role: Gate
      Name: Gate
      Gid: 1
      Port: 15010
      MaxPlayers: 1000
    - Role: FdLobby
      Name: FdLobby
      Gid: 2
      Port: 28041
      MaxPlayers: 1000
    - Role: Lobby
      Name: Open Eleven Server
      Gid: 3
      Port: 28042
      MaxPlayers: 1000
    - Role: Menu
      Name: Menu
      Gid: 4
      Port: 28043
      MaxPlayers: 1000
    - Role: Account
      Name: Account
      Gid: 5
      Port: 28044
      MaxPlayers: 1000
    - Role: VdpChat
      Name: VdpChat
      Gid: 6
      Port: 28045
      MaxPlayers: 1000

  Lobbies:
    - Name: Beginner
      MaxPlayers: 100
      Type: open
    - Name: Standard
      MaxPlayers: 100
      Type: open
    - Name: Expert
      MaxPlayers: 100
      Type: open

  Protocol:
    ChallengeCode: "00112233445566778899aabbccddeeff"
    PendingLoginLifetimeSeconds: 300
    PlayerSearchLimit: 100
    BlockedTerms: []
    ServerVersion: "1.0"
    PatchVersion: "1.03"
    DlcVersion: "1.07"
    EulaVersion: "1.0"
    AckUnknownCommands: true
    AckBinaryPackets: true
    EnforceSessionState: true
    EnforceServiceRoles: false
    ShareIdentityByRemoteAddress: false
    EmitUnconfirmedMessages: false

  # Online Competition. Times are UTC. Entrants pick a team and play the qualifying round
  # (MatchStart..MatchEnd) with "To Next Match", against other entrants. Then the best PlayoffSize
  # (2..16; 0 = no playoff, the table decides) play a knockout bracket from PlayoffStart (default
  # MatchEnd), one round every PlayoffRoundMinutes; who has not turned up after ShowUpMinutes
  # loses to who did. Kind and Trophy are pes2013.exe compe_kind names: KONAMI_CHAMPIONSHIP,
  # UEFA_Champions_League, International_Cup_Online, WEPES_CLUB_OPEN, Novice_Cup, ML_Open,
  # ML_High_Class_Cup, RESERVED_CUP01..100... EntryLimit is SKILLLEVEL (SkillLevels: [BEGINNER,
  # AMATEUR, STANDARD, PROFESSIONAL, TOPPLAYER, SUPERSTAR], empty = all) or TEAMPOWER (MLO).
  # RepeatEveryDays runs it again as compe_id Id + n with its times moved; leave a gap of ids.
  # A Master League competition has MasterLeague: true, MinTeamPower/MaxTeamPower and Prizes by
  # playoff result: [VICTORY, SECOND_PLACE, BEST_4, BEST_8, FINAL_ADVANCEMENT].
  Competitions:
    - Id: 1000
      Name: OpenEleven Weekly Cup
      Kind: KONAMI_CHAMPIONSHIP
      Category: GOLD              # PLATINUM | GOLD | SILVER | BRONZE
      EntryStart: 2026-11-09T00:00:00Z
      EntryEnd: 2026-11-14T18:00:00Z
      MatchStart: 2026-11-10T00:00:00Z
      MatchEnd: 2026-11-14T18:00:00Z
      End: 2026-11-15T12:00:00Z
      Capacity: 64
      GameTime: TIME_10           # TIME_5 | TIME_10 | TIME_15
      PlayoffSize: 16
      MinQualifierMatches: 3
      PlayoffRoundMinutes: 30
      ShowUpMinutes: 10
      RepeatEveryDays: 7
    - Id: 2000
      Name: MLO Open
      Kind: ML_Open
      MasterLeague: true
      EntryLimit: TEAMPOWER
      MinTeamPower: 0
      MaxTeamPower: 0
      EntryStart: 2026-11-09T00:00:00Z
      EntryEnd: 2026-11-21T18:00:00Z
      MatchStart: 2026-11-10T00:00:00Z
      MatchEnd: 2026-11-21T18:00:00Z
      End: 2026-11-22T12:00:00Z
      Capacity: 64
      PlayoffSize: 8
      MinQualifierMatches: 3
      Prizes: [3000000, 1500000, 800000, 400000, 200000]
      RepeatEveryDays: 14

  # Master League Online. The footballers and squads are read once from the game installation
  # (img\dt0f.img with Kitserver's replacements) and cached in CatalogCache; delete the cache to
  # read the game again. The economy values are a starting point to tune.
  MasterLeague:
    GameDirectory: 'C:\Program Files (x86)\KONAMI\Pro Evolution Soccer 2013'
    CatalogCache: "data/ml-catalog.json"
    StartingTeamId: 140          # MASTERLEAGUE DEFAULT
    StartingFunds: 5000000
    MaxSquad: 32
    MinSquad: 18
    BuysPerPeriod: 5
    BuyPeriodDays: 7
    PriceAt75: 300000            # price of an overall 75 footballer; ×1.25 per point
    PricePercentPerOwner: 2
    MaxDemandPercent: 100
    SellPercent: 80
    NewContractMatches: 10
    ExtendMatches: [10, 20, 30]  # CONTRACT_TYPE1..3
    SalaryPerMille: 5            # salary per match = 0.5% of the market price
    WinIncome: 300000
    DrawIncome: 180000
    LossIncome: 100000
    YellowCardCost: 10000
    RedCardCost: 30000
    DerbyIncome: 50000
    DivisionPoints: [30, 90, 180, 300]
    RivalRankBonus: [1000000, 600000, 300000]

  Debug:
    HexDump: true
    HexDumpMaxBytes: 1024
    PrettyPrintPayloads: true
    LogUnknownCommands: true
    LogOutboundPayloads: true
